[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpitool"
dynamic = ["version"]
description = "Climate Model Performance Index: compare a climate model with observations and with CMIP6"
readme = "README.rst"
license = {text = "MIT"}
authors = [{name = "Jan Streffing", email = "j.streffing1988@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "cartopy",
    "geopandas",
    "matplotlib",
    "netCDF4>=1.6.0",
    "numpy",
    "pandas>=1.0.0",
    "pooch",
    "regionmask>=0.11",
    "seaborn>=0.13",
    "tqdm",
    "xarray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/JanStreffing/cmpitool"
Documentation = "https://cmpitool.readthedocs.io/"

[tool.setuptools]
packages = ["cmpitool"]

[tool.setuptools.package-data]
cmpitool = ["data/*.geojson"]

[tool.setuptools.dynamic]
version = {attr = "cmpitool.__version__"}
